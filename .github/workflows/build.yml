name: Build

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify and package
        run: ./gradlew clean check shadowJar --no-daemon

      - name: Upload packaged plugin
        uses: actions/upload-artifact@v4
        with:
          name: bots4velo-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
