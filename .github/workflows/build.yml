name: Build and test

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Test and build shaded plugin
        run: ./gradlew clean check shadowJar writeArtifactChecksum

  protocol-contract:
    name: Protocol contract (${{ matrix.protocol }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        protocol: ["1.16.5", "1.21.11", "26.1.2", "26.2"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Verify protocol mapping
        run: ./gradlew test --tests dev.nulli0n.vbot.protocol.ProtocolVersionTest -PciProtocol="${{ matrix.protocol }}"

  integration-network:
    name: Network integration (${{ matrix.minecraft }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.16.5"
            protocol: "754"
            server-java: "17"
          - minecraft: "1.21.11"
            protocol: "774"
            server-java: "21"
          - minecraft: "26.1.2"
            protocol: "775"
            server-java: "25"
          - minecraft: "26.2"
            protocol: "776"
            server-java: "25"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21 for the plugin build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Build the integration plugin
        run: ./gradlew clean shadowJar

      - name: Set up runtime Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "${{ matrix.server-java }}"

      - name: Start and verify the disposable network
        run: |
          chmod +x scripts/ci/run-network-integration.sh
          scripts/ci/run-network-integration.sh "${{ matrix.minecraft }}" "${{ matrix.protocol }}"

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.minecraft }}-logs
          path: .integration-network/${{ matrix.minecraft }}/**/*.log
          if-no-files-found: warn
