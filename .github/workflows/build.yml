name: Build and test

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Test and build shaded plugin
        run: ./gradlew clean check shadowJar writeArtifactChecksum

  protocol-contract:
    name: Protocol contract (${{ matrix.protocol }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        protocol: ["1.16.5", "1.21.11", "26.1.2", "26.2"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Verify protocol mapping
        run: ./gradlew test --tests dev.nulli0n.vbot.protocol.ProtocolVersionTest -PciProtocol="${{ matrix.protocol }}"
