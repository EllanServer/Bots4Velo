name: Build major release

on:
  push:
    tags:
      # GitHub's glob syntax applies + to the previous character class. This
      # matches numeric vX.0.0 tags, but not vX.1.0 or
      # vX.0.1.
      - "v[0-9]+.0.0"

permissions:
  contents: write

jobs:
  quality-gate:
    uses: ./.github/workflows/build.yml

  build-and-release:
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Test and build release JAR
        run: ./gradlew clean test shadowJar -PpluginVersion="${GITHUB_REF_NAME#v}"

      - name: Verify the shaded release JAR
        run: ./gradlew verifyShadowJar -PpluginVersion="${GITHUB_REF_NAME#v}"

      - name: Generate artifact checksum
        run: ./gradlew writeArtifactChecksum -PpluginVersion="${GITHUB_REF_NAME#v}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: bots4velo-${{ github.ref_name }}
          path: build/libs/*
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/libs/*.jar --title "${GITHUB_REF_NAME}" --verify-tag --generate-notes

      - name: Upload release checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" build/libs/*.sha256 --clobber
