name: Build feature release

on:
  push:
    tags:
      # A planned feature release is vX.Y.0 (for example v2.1.0).
      # Patch tags remain build-only and never create a GitHub Release.
      - "v[0-9]+.[0-9]+.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Test and build release JAR
        run: ./gradlew clean test shadowJar -PpluginVersion="${GITHUB_REF_NAME#v}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: bots4velo-${{ github.ref_name }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/libs/*.jar --title "${GITHUB_REF_NAME}" --verify-tag --generate-notes
